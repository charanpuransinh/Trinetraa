# ─────────────────────────────────────────────────────────────
#  TRISHUL PRO — Docker Compose
#  Self-healing: restarts on crash AND on server reboot
#  Author: Aruna | Project: Trishul Pro Master
# ─────────────────────────────────────────────────────────────

services:

  # ── Main Trading Dashboard (Trishul Pro) ──────────────────
  trishul-pro:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trishul-pro
    restart: always          # ← SELF-HEALING: auto-restart on crash + reboot
    ports:
      - "80:80"              # HTTP on port 80
      - "443:443"            # HTTPS ready (for future SSL)
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "project=trishul-pro"
      - "author=aruna"

  # ── Watchtower: Auto-pull & restart updated images ─────────
  # (optional but powerful — monitors and auto-updates containers)
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 --cleanup  # checks every 5 minutes
    environment:
      - WATCHTOWER_LABEL_ENABLE=false
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
