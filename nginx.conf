server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index trishul-pratham.html;

    # ── Gzip compression for faster load ──
    gzip on;
    gzip_types text/html text/css application/javascript application/json;

    # ── Static file caching (CSS/JS) ──
    location ~* \.(css|js|woff2|png|jpg|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ── Health check endpoint for Docker ──
    location /health {
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # ── Trishul Pro pages ──
    location /pratham   { try_files /trishul-pratham.html =404; }
    location /dwitiya   { try_files /trishul-dwitiya.html =404; }
    location /tritiya   { try_files /trishul-tritiya.html =404; }
    location /chaturth  { try_files /trishul-chaturth.html =404; }
    location /command   { try_files /trishul-command.html =404; }

    # ── Trinetra & Garud projects ──
    location /trinetra  { try_files /trinetra/index.html /trinetra.html =404; }
    location /garud     { try_files /garud/index.html /garud.html =404; }

    # ── Fallback: serve whatever file is requested ──
    location / {
        try_files $uri $uri/ /trishul-pratham.html;
    }

    # ── Security headers ──
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
}
